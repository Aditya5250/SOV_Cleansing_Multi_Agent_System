version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sov-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - LLM_PROVIDER=deterministic
      - EMBEDDING_MODEL_NAME=all-MiniLM-L6-v2
    volumes:
      - ./scratch:/app/scratch
      - ./sample_data:/app/sample_data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sov-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
