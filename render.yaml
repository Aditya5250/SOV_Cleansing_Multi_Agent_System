services:
  # Backend FastAPI Web Service
  - type: web
    name: sov-cleansing-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m backend.app.main
    envVars:
      - key: LLM_PROVIDER
        value: deterministic
      - key: EMBEDDING_MODEL_NAME
        value: none
      - key: CORS_ORIGINS
        value: "*"

  # Frontend React SPA Static Site
  - type: web
    name: sov-cleansing-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: sov-cleansing-backend
          property: host
